plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id("com.google.dagger.hilt.android")

    id 'com.google.gms.google-services'
}

android {
    namespace "com.sag.todo.list.task.reminder"
    compileSdk 35

    defaultConfig {
//        applicationId "com.sag.todo.list.task.reminder"
        applicationId "com.example.debug"

        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def appName = "To-Do-List-Task-Reminder"
        def versionCode = android.defaultConfig.versionCode.toString().trim()
        def versionName = android.defaultConfig.versionName
        setProperty("archivesBaseName", "$appName-VC-$versionCode-VN-$versionName")
    }

    buildTypes {
        release {
            resValue "string", "appId", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "dashboardScreenBannerAdId", "ca-app-pub-3342111410257125/9943801959"
            resValue "string", "settingsScreenBannerAdId", ""
            resValue "string", "detailScreenBannerAdId", ""

            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            resValue "string", "appId", "ca-app-pub-3342111410257125~8073205135"
            resValue "string", "dashboardScreenBannerAdId", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "settingsScreenBannerAdId", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "detailScreenBannerAdId", "ca-app-pub-3940256099942544/9214589741"

            minifyEnabled false
            shrinkResources false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

//    'sdp & ssp' dependencies...
    api 'com.intuit.sdp:sdp-android:1.1.1'
    api 'com.intuit.ssp:ssp-android:1.1.1'

//    'Lottie Animation' dependency...
    api 'com.airbnb.android:lottie:6.6.7'

//    'ViewModel & LiveData' dependency...
    api 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
    api 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.1'

//    'CircularImageView' dependency...
    api 'com.github.AtifSayings:CircularImageView:1.0.2'

//    'MultiDex' dependency...
    api "androidx.multidex:multidex:2.0.1"

//    'ShapeAbleImageView' dependency...
    api 'com.google.android.material:material:1.12.0'

//    'Ads' dependency...
    api "com.google.android.gms:play-services-ads:24.4.0"

//    'Coroutines' dependencies...
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

//    'ROOM database' dependency...
    api "androidx.room:room-runtime:2.7.2"
    ksp "androidx.room:room-compiler:2.7.2"

//    To use Kotlin Coroutines...
    api "androidx.room:room-ktx:2.7.2"

//    'In-App update' dependency...
    api 'com.google.android.play:app-update-ktx:2.1.0'

//    "Hilt" dependency...
    api "com.google.dagger:hilt-android:2.56.2"
    ksp "com.google.dagger:hilt-android-compiler:2.56.2"

//    "Firebase" dependencies...
    api platform('com.google.firebase:firebase-bom:33.16.0')
    api 'com.google.firebase:firebase-config'
}