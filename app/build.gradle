android {
    namespace "com.sag.todo.list.task.reminder"
    compileSdkVersion 36

    defaultConfig {
//        applicationId "com.sag.todo.list.task.reminder"
        applicationId "com.example.debug"

        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.1"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    base {
        def appName = "Task-Reminder"
        def versionCode = android.defaultConfig.versionCode.toString().trim()
        def versionName = android.defaultConfig.versionName
        archivesName = "$appName-VC-$versionCode-VN-$versionName"
    }

    buildTypes {
        release {
            /*resValue "string", "appId", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "dashboardScreenBannerAdId", "ca-app-pub-3342111410257125/9943801959"
            resValue "string", "settingsScreenBannerAdId", ""
            resValue "string", "detailScreenBannerAdId", ""*/

            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            /*resValue "string", "appId", "ca-app-pub-3342111410257125~8073205135"
            resValue "string", "dashboardScreenBannerAdId", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "settingsScreenBannerAdId", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "detailScreenBannerAdId", "ca-app-pub-3940256099942544/9214589741"*/

            minifyEnabled false
            shrinkResources false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

